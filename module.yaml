# ==============================================================================
# MODULE INTERFACE DEFINITION
# ==============================================================================
# bag_metashape_export - Extract georeferenced images from ROS bags for Metashape
# ==============================================================================

name: "bag_metashape_export"
display_name: "Bag Image Export"
tags: ["AUV", "3D"]
version: "1.0.0"
description: "Extract georeferenced images from ROS bag files for Agisoft Metashape photogrammetry"
author: "Lauren K Olinger"
created: "2026-02-04"

# Module classification
type: "extract"

# ------------------------------------------------------------------------------
# INPUTS
# ------------------------------------------------------------------------------
inputs:
  - name: "bag_file"
    type: "file"
    formats: [".bag"]
    location: "<NAS path supplied at run time>"
    required: true
    description: "ROS bag file containing camera images and pose data"

# ------------------------------------------------------------------------------
# OUTPUTS - data-dictionary contract
# ------------------------------------------------------------------------------
# Each entry binds a physical artifact to a descriptor under
# _METADATA/dictionary/datasets/<dataset>.yaml. eml: true triggers EML 2.2.0
# generation at run finalisation via _METADATA/sidecar/generate.py.
outputs:
  - dataset: "bag_metashape_export_down_images"
    path_template: "inprocess/{run_name}/outputs/{bag_name}/down_images/"
    eml: true                                                            # directory of down-facing 4K JPGs

  - dataset: "bag_metashape_export_forward_images"
    path_template: "inprocess/{run_name}/outputs/{bag_name}/forward_images/"
    eml: true                                                            # directory of forward-facing ZED2 JPGs

  - dataset: "bag_metashape_export_down_reference"
    path_template: "inprocess/{run_name}/outputs/{bag_name}/down_reference.csv"
    eml: true                                                            # Metashape-import georeference CSV

  - dataset: "bag_metashape_export_forward_reference"
    path_template: "inprocess/{run_name}/outputs/{bag_name}/forward_reference.csv"
    eml: true                                                            # Metashape-import georeference CSV

  - dataset: "bag_metashape_export_mission_map"
    path_template: "inprocess/{run_name}/outputs/{bag_name}/mission_map.png"
    eml: true                                                            # mission-path visualization

# ------------------------------------------------------------------------------
# PARAMETERS
# ------------------------------------------------------------------------------
parameters:
  - name: "output_dir"
    type: "string"
    default: "."
    required: false
    description: "Output directory (defaults to current directory)"

# ------------------------------------------------------------------------------
# EXPECTED ROS TOPICS
# ------------------------------------------------------------------------------
# These are the default topics the script expects in the bag file:
ros_topics:
  required:
    - topic: "/pose"
      type: "rangerbot_msgs/pose"
      description: "Position (x=lon, y=lat), depth, heading, pitch, roll, altitudeUsed"

  cameras:
    - topic: "/science/image_raw"
      type: "sensor_msgs/Image"
      description: "Down-facing science camera (4K)"
      camera_name: "down"

    - topic: "/zed2/zed_node/left/image_rect_color"
      type: "sensor_msgs/Image"
      description: "Forward-facing ZED2 camera"
      camera_name: "forward"

  optional:
    - topic: "/pressure"
      description: "Pressure sensor depth"
    - topic: "/dvl_dr"
      description: "DVL dead reckoning position"
    - topic: "/dvl_fix"
      description: "DVL velocity and altitude"

# ------------------------------------------------------------------------------
# RUNTIME REQUIREMENTS
# ------------------------------------------------------------------------------
runtime:
  python_version: ">=3.10"
  gpu_required: false
  tested_os:
    - "Ubuntu 22.04"
    - "Ubuntu 24.04"
  dependencies: "requirements.txt"
  estimated_time: "1-5 min per bag file depending on image count"

# ------------------------------------------------------------------------------
# CLI INTERFACE
# ------------------------------------------------------------------------------
cli:
  main_script: "extract_georeferenced_images.py"

# ------------------------------------------------------------------------------
# RELATED STUDIES
# ------------------------------------------------------------------------------
studies:
  - "S1_historical"
  - "S2_3D_structure"
  - "S3_colony_tracking"

# ------------------------------------------------------------------------------
# METASHAPE IMPORT SETTINGS
# ------------------------------------------------------------------------------
# After running this module, import to Metashape with these settings:
metashape_import:
  coordinate_system: "WGS 84 (EPSG:4326)"
  columns:
    label: 1
    longitude: 2
    latitude: 3
    altitude: 4
    yaw: 5
    pitch: 6
    roll: 7
  start_row: 2
  rotation_format: "Yaw, Pitch, Roll (degrees)"

# ------------------------------------------------------------------------------
# NOTES
# ------------------------------------------------------------------------------
notes: |
  This module extracts images and pose data from ROS bag files recorded by
  underwater vehicles (AUVs/ROVs) and generates reference files for
  photogrammetric reconstruction in Agisoft Metashape.

  The script interpolates pose data to match exact image timestamps,
  providing accurate geolocation for each extracted frame.

  To modify camera topics, edit CAMERA_CONFIG in the script or use
  the script as a template for custom configurations.
